name: TKB notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi API kiểm tra & gửi thông báo
        run: |
          curl -fsS -X GET "${{ secrets.APP_URL }}/api/check-and-notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Giữ lịch chạy khỏi bị GitHub tự tắt sau 60 ngày im ắng
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Số ngày kể từ commit gần nhất: $days"
          if [ "$days" -ge 45 ]; then
            date -u > .keepalive
            git add .keepalive
            git commit -m "chore: keepalive tự động (giữ lịch GitHub Actions không bị tắt)"
            git push
          else
            echo "Chưa cần commit giữ chỗ."
          fi
